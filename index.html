<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>talos1899 · 项目作品集</title>
<meta name="description" content="talos1899 的项目作品集：交互式相机拆解、WebGL 流体模拟、小红书 AI 信息源与 DSH 通知插件。">
<meta name="theme-color" content="#0b0d10">
<meta property="og:type" content="website">
<meta property="og:title" content="talos1899 · 项目作品集">
<meta property="og:description" content="交互式拆解、流场模拟、AI 信息源与开发工具。">
<meta property="og:image" content="https://talos1899.github.io/welcome/assets/flowfield.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%230b0d10'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='%236ee7b7' stroke-width='2.5'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%236ee7b7'/%3E%3C/svg%3E">
<style>
  :root{
    color-scheme:dark;
    --bg:#0b0d10;
    --panel:#14181f;
    --panel-2:#1a2029;
    --text:#e8edf5;
    --muted:#97a3b6;
    --line:#28313d;
    --accent:#6ee7b7;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;
    background:
      radial-gradient(circle at 20% 0%,rgba(110,231,183,.12),transparent 32rem),
      radial-gradient(circle at 85% 0%,rgba(96,165,250,.10),transparent 30rem),
      var(--bg);
    color:var(--text);
    line-height:1.65;
    overflow-x:hidden;
  }
  a{color:inherit}
  .wrap{width:min(1120px,calc(100% - 40px));margin:0 auto}

  /* 顶部进度条 */
  .progress{
    position:fixed;top:0;left:0;height:2px;width:0%;z-index:60;
    background:linear-gradient(90deg,var(--accent),#60a5fa);
    box-shadow:0 0 14px rgba(110,231,183,.7);
    transition:width .1s linear;
  }

  /* 导航 */
  .nav{
    position:fixed;top:0;left:0;right:0;z-index:50;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    background:rgba(11,13,16,.55);
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  .nav-inner{
    width:min(1120px,calc(100% - 40px));margin:0 auto;
    height:62px;display:flex;align-items:center;justify-content:space-between;
  }
  .brand{font-weight:800;letter-spacing:-.03em;font-size:17px;text-decoration:none}
  .brand span{color:var(--accent)}
  .nav a.ghost{
    text-decoration:none;font-size:14px;color:var(--muted);
    padding:7px 14px;border:1px solid var(--line);border-radius:999px;transition:.22s;
  }
  .nav a.ghost:hover{color:var(--accent);border-color:rgba(110,231,183,.55)}

  /* 鼠标光晕 */
  .cursor-glow{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(420px circle at var(--mx,50%) var(--my,20%),rgba(110,231,183,.10),transparent 62%);
    transition:background .12s linear;
  }

  /* 流场画布 */
  #flow{position:fixed;inset:0;z-index:0;width:100%;height:100%;pointer-events:none}

  .wrap{position:relative;z-index:2}

  /* Hero */
  .hero{padding:190px 0 110px;position:relative}
  .kicker{
    margin:0 0 22px;font-size:12px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--accent);display:flex;align-items:center;gap:12px;
  }
  .kicker::after{content:"";flex:1;max-width:120px;height:1px;background:linear-gradient(90deg,var(--accent),transparent)}
  .hero h1{
    margin:0;
    font-size:clamp(46px,9.5vw,118px);
    line-height:.94;letter-spacing:-.055em;font-weight:850;
    background:linear-gradient(175deg,#fff 8%,#a8b6cc 92%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero h1 .grad{
    background:linear-gradient(100deg,#6ee7b7,#60a5fa 55%,#a78bfa);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero .sub{max-width:620px;margin:30px 0 0;font-size:clamp(16px,1.6vw,19px);color:var(--muted)}
  .hero-actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:38px}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:12px 22px;border-radius:999px;
    font-size:15px;font-weight:600;text-decoration:none;
    border:1px solid var(--line);background:rgba(255,255,255,.03);
    transition:.24s cubic-bezier(.2,.8,.2,1);
  }
  .btn:hover{transform:translateY(-2px);border-color:rgba(110,231,183,.6);color:var(--accent)}
  .btn.primary{background:var(--accent);color:#052019;border-color:transparent;box-shadow:0 10px 34px -12px rgba(110,231,183,.85)}
  .btn.primary:hover{color:#052019;box-shadow:0 16px 44px -12px rgba(110,231,183,1)}

  /* 章节头 */
  .sec-head{
    display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
    padding:34px 0 30px;border-top:1px solid var(--line);
  }
  .sec-head h2{margin:0;font-size:clamp(24px,3vw,34px);letter-spacing:-.035em;font-weight:800}
  .sec-head p{margin:0;color:var(--muted);font-size:14px}

  /* 卡片网格 */
  .grid{
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
    gap:26px;padding:0 0 110px;perspective:1200px;
  }
  .card{
    position:relative;border-radius:22px;border:1px solid var(--line);
    background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.015));
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    overflow:hidden;transform-style:preserve-3d;will-change:transform;
    transition:transform .3s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .3s;
  }
  .card:hover{
    border-color:rgba(var(--accent),.6);
    box-shadow:0 30px 70px -30px rgba(0,0,0,.9),0 0 0 1px rgba(var(--accent),.18),0 0 60px -20px rgba(var(--accent),.55);
  }
  .card::after{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:radial-gradient(340px circle at var(--mx,50%) var(--my,50%),rgba(var(--accent),.18),transparent 62%);
    opacity:0;transition:opacity .35s;
  }
  .card:hover::after{opacity:1}

  .shot{
    position:relative;display:block;aspect-ratio:16/10;overflow:hidden;
    background:linear-gradient(140deg,rgba(var(--accent),.45),#0c0f14 72%);
  }
  .shot img{
    width:100%;height:100%;object-fit:cover;display:block;
    transition:transform .55s cubic-bezier(.2,.8,.2,1);
    transform:scale(1.01);
  }
  .card:hover .shot img{transform:scale(1.07)}
  .fallback{
    position:absolute;inset:0;display:none;place-items:center;
    font-size:52px;font-weight:900;letter-spacing:-.06em;color:rgba(255,255,255,.9);
    background:linear-gradient(140deg,rgba(var(--accent),.55),#0a0d12 78%);
  }
  .shot.noimg img{display:none}
  .shot.noimg .fallback{display:grid}
  .shot-badge{
    position:absolute;left:16px;bottom:16px;padding:6px 13px;border-radius:999px;
    font-size:12px;font-weight:700;background:rgba(7,8,11,.72);
    border:1px solid rgba(var(--accent),.5);color:rgb(var(--accent));
    backdrop-filter:blur(8px);opacity:0;transform:translateY(8px);
    transition:.35s cubic-bezier(.2,.8,.2,1);
  }
  .card:hover .shot-badge{opacity:1;transform:none}

  .info{padding:24px 24px 26px}
  .info-top{display:flex;align-items:baseline;gap:12px}
  .num{font-size:12px;font-weight:800;letter-spacing:.1em;color:rgb(var(--accent));opacity:.9}
  .info h3{margin:0;font-size:20px;letter-spacing:-.025em;font-weight:750}
  .info p{margin:10px 0 16px;color:var(--muted);font-size:14.5px;min-height:50px}
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
  .tags span{
    padding:4px 10px;border-radius:999px;font-size:12px;
    color:var(--muted);border:1px solid var(--line);background:rgba(255,255,255,.02);
  }
  .links{display:flex;flex-wrap:wrap;gap:10px}
  .links a{
    padding:9px 16px;border-radius:11px;font-size:13.5px;font-weight:600;
    text-decoration:none;border:1px solid var(--line);transition:.22s;
  }
  .links a:hover{border-color:rgba(var(--accent),.65);color:rgb(var(--accent))}
  .links a.primary{background:rgba(var(--accent),.14);border-color:rgba(var(--accent),.4);color:rgb(var(--accent))}
  .links a.primary:hover{background:rgba(var(--accent),.24)}

  /* 入场动画 */
  .reveal{opacity:0;transform:translateY(30px);transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1)}
  .reveal.in{opacity:1;transform:none}

  footer{
    padding:34px 0 60px;border-top:1px solid var(--line);
    color:var(--muted);font-size:13px;
    display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;
  }

  @media (max-width:820px){
    .hero{padding:150px 0 80px}
    .grid{grid-template-columns:1fr;gap:20px}
    .sec-head{display:block}
    .sec-head p{margin-top:6px}
    .card{transform:none!important}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition-duration:.01ms!important}
    .reveal{opacity:1;transform:none}
  }
</style>
</head>
<body>

<div class="progress" id="progress"></div>
<canvas id="flow" aria-hidden="true"></canvas>
<div class="cursor-glow" id="glow"></div>

<nav class="nav">
  <div class="nav-inner">
    <a class="brand" href="#top">talos<span>1899</span></a>
    <a class="ghost" href="https://github.com/talos1899" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
  </div>
</nav>

<header class="hero wrap" id="top">
  <p class="kicker reveal">Portfolio</p>
  <h1 class="reveal">做点<span class="grad">好玩</span><br>的东西。</h1>
  <p class="sub reveal">
    交互式拆解、流场模拟、AI 信息源与开发工具。
    每个项目都是一个可以点开把玩的实验。
  </p>
  <div class="hero-actions reveal">
    <a class="btn primary" href="#work">浏览项目</a>
    <a class="btn" href="https://github.com/talos1899?tab=repositories" target="_blank" rel="noopener noreferrer">全部仓库 ↗</a>
  </div>
</header>

<main class="wrap" id="work">
  <div class="sec-head">
    <h2>项目</h2>
    <p id="count"></p>
  </div>
  <div class="grid" id="grid"></div>
</main>

<footer class="wrap">
  <span>© <span id="year"></span> talos1899</span>
  <span>Built with GitHub Pages</span>
</footer>

<script>
const projects = [
  {
    title:"canon-talos",
    desc:"把 1976 年的 35mm 单反相机搬进浏览器，逐层拆解、自由旋转，看清每一颗螺丝。",
    tags:["Three.js","WebGL","交互"],
    demo:"https://talos1899.github.io/canon-talos/",
    repo:"https://github.com/talos1899/canon-talos",
    cover:"./assets/canon-talos.png",
    accent:"217,164,65"
  },
  {
    title:"FlowField-Playground",
    desc:"基于 WebGL 的实时流体模拟实验：染料、涡度与泛光，鼠标划过就能搅动一整片漩涡。",
    tags:["WebGL","Canvas","模拟"],
    demo:"https://talos1899.github.io/FlowField-Playground/",
    repo:"https://github.com/talos1899/FlowField-Playground",
    cover:"./assets/flowfield.png",
    accent:"110,231,183"
  },
  {
    title:"xhs-dots",
    desc:"把小红书接成 AI 助手的信息源：需要真实经验时，让 AI 自己去检索笔记、总结回答。",
    tags:["AI","工具","自动化"],
    demo:"",
    repo:"https://github.com/talos1899/xhs-dots",
    cover:"./assets/xhs-dots.png",
    accent:"251,113,133"
  },
  {
    title:"dsh-notification-hook",
    desc:"为 DSH 增加任务状态桌面通知：跑完、失败或等你确认时，以 DeepSeek Harness 的名义提醒你。",
    tags:["插件","Windows","效率"],
    demo:"",
    repo:"https://github.com/talos1899/dsh-notification-hook",
    cover:"./assets/dsh-hook.png",
    accent:"96,165,250"
  }
];

const grid = document.getElementById("grid");

grid.innerHTML = projects.map((p,i)=>{
  const main = p.demo || p.repo;
  const initials = p.title.replace(/[^a-zA-Z]/g,"").slice(0,2).toUpperCase();

  return `
  <article class="card reveal" style="--accent:${p.accent}">
    <a class="shot" href="${main}" target="_blank" rel="noopener noreferrer" aria-label="打开 ${p.title}">
      <img src="${p.cover}" alt="${p.title} 截图" loading="lazy" decoding="async"
           onerror="this.parentElement.classList.add('noimg')">
      <span class="fallback">${initials}</span>
      <span class="shot-badge">${p.demo ? "在线演示 ↗" : "查看项目 ↗"}</span>
    </a>
    <div class="info">
      <div class="info-top">
        <span class="num">${String(i+1).padStart(2,"0")}</span>
        <h3>${p.title}</h3>
      </div>
      <p>${p.desc}</p>
      <div class="tags">${p.tags.map(t=>`<span>${t}</span>`).join("")}</div>
      <div class="links">
        ${p.demo ? `<a class="primary" href="${p.demo}" target="_blank" rel="noopener noreferrer">在线演示 ↗</a>` : ""}
        <a class="${p.demo ? "" : "primary"}" href="${p.repo}" target="_blank" rel="noopener noreferrer">源码</a>
      </div>
    </div>
  </article>`;
}).join("");

document.getElementById("count").textContent = `${projects.length} 个公开项目`;
document.getElementById("year").textContent = new Date().getFullYear();

const io = new IntersectionObserver((entries)=>{
  entries.forEach((e,i)=>{
    if(e.isIntersecting){
      e.target.style.transitionDelay = `${Math.min(i*90,300)}ms`;
      e.target.classList.add("in");
      io.unobserve(e.target);
    }
  });
},{threshold:.12,rootMargin:"0px 0px -8% 0px"});

document.querySelectorAll(".reveal").forEach(el=>io.observe(el));

const fine = matchMedia("(hover:hover) and (pointer:fine)").matches;

if(fine){
  document.querySelectorAll(".card").forEach(card=>{
    let raf=null;
    card.addEventListener("pointermove",e=>{
      const r=card.getBoundingClientRect();
      const px=(e.clientX-r.left)/r.width;
      const py=(e.clientY-r.top)/r.height;
      card.style.setProperty("--mx",`${px*100}%`);
      card.style.setProperty("--my",`${py*100}%`);
      if(raf) return;
      raf=requestAnimationFrame(()=>{
        raf=null;
        const rx=(0.5-py)*9, ry=(px-0.5)*11;
        card.style.transform=`perspective(1000px) rotateX(${rx}deg) rotateY(${ry}deg) translateY(-6px)`;
      });
    });
    card.addEventListener("pointerleave",()=>{card.style.transform=""});
  });
}

const glow=document.getElementById("glow");
addEventListener("pointermove",e=>{
  glow.style.setProperty("--mx",`${e.clientX}px`);
  glow.style.setProperty("--my",`${e.clientY}px`);
},{passive:true});

const bar=document.getElementById("progress");
addEventListener("scroll",()=>{
  const h=document.documentElement.scrollHeight-innerHeight;
  bar.style.width=`${h>0?(scrollY/h)*100:0}%`;
},{passive:true});

(()=>{
  const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  const cvs=document.getElementById("flow");
  const ctx=cvs.getContext("2d",{alpha:true});
  let W=0,H=0,DPR=1,particles=[];
  const mouse={x:-9999,y:-9999,active:false};

  function resize(){
    DPR=Math.min(devicePixelRatio||1,2);
    W=innerWidth;H=innerHeight;
    cvs.width=W*DPR;cvs.height=H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    const target=Math.min(190,Math.floor((W*H)/11000));
    particles=Array.from({length:target},()=>({
      x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,warm:Math.random()<.22
    }));
    if(reduce) drawStatic();
  }

  function angleAt(x,y,t){
    return Math.sin(x*0.0018+t*.6)*1.9
         + Math.cos(y*0.0021-t*.45)*1.9
         + Math.sin((x+y)*0.0011+t*.9)*1.3;
  }

  function step(t){
    ctx.globalCompositeOperation="destination-out";
    ctx.fillStyle="rgba(0,0,0,0.085)";
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation="lighter";
    for(const p of particles){
      const a=angleAt(p.x,p.y,t);
      p.vx+=Math.cos(a)*.09;
      p.vy+=Math.sin(a)*.09;
      if(mouse.active){
        const dx=mouse.x-p.x,dy=mouse.y-p.y,d2=dx*dx+dy*dy;
        if(d2<26000&&d2>1){
          const f=((26000-d2)/26000)*.55,d=Math.sqrt(d2);
          p.vx+=(dx/d)*f;p.vy+=(dy/d)*f;
        }
      }
      p.vx*=.945;p.vy*=.945;p.x+=p.vx;p.y+=p.vy;
      if(p.x<-20)p.x=W+20;if(p.x>W+20)p.x=-20;
      if(p.y<-20)p.y=H+20;if(p.y>H+20)p.y=-20;
      const speed=Math.min(Math.hypot(p.vx,p.vy),2.6);
      const alpha=.10+speed*.22;
      ctx.beginPath();
      ctx.strokeStyle=p.warm?`rgba(167,139,250,${alpha})`:`rgba(110,231,183,${alpha})`;
      ctx.lineWidth=1.15;
      ctx.moveTo(p.x,p.y);
      ctx.lineTo(p.x-p.vx*2.4,p.y-p.vy*2.4);
      ctx.stroke();
    }
  }

  function drawStatic(){
    ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation="lighter";
    for(const p of particles){
      ctx.beginPath();
      ctx.strokeStyle=p.warm?"rgba(167,139,250,.18)":"rgba(110,231,183,.18)";
      ctx.lineWidth=1;
      const a=angleAt(p.x,p.y,0);
      ctx.moveTo(p.x,p.y);
      ctx.lineTo(p.x-Math.cos(a)*14,p.y-Math.sin(a)*14);
      ctx.stroke();
    }
  }

  const start=performance.now();
  function loop(now){
    if(reduce) return;
    step((now-start)/1000);
    requestAnimationFrame(loop);
  }

  addEventListener("resize",resize,{passive:true});
  addEventListener("pointermove",e=>{
    mouse.x=e.clientX;mouse.y=e.clientY;mouse.active=true;
  },{passive:true});
  addEventListener("pointerleave",()=>{mouse.active=false});

  resize();
  if(!reduce) requestAnimationFrame(loop);
})();
</script>
</body>
</html>
